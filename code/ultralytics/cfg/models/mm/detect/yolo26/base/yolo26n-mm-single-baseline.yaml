# 单模态基线（YOLO26 版，plain single-modal YAML，不含任何多模态路由/融合节点/双头）。
#
# 用途：为 YOLO26 侧的 E1（RGB-only）与 E3（IR-only）提供单模态分母，
# 与 yolo26n-mm-dual-fusion-deform.yaml 构成「单模态 vs 双模态」的对照。
#
# 与 yolo11n-mm-single-baseline.yaml 逐层同构，只换两处代际变量：
#   1) SPPF 使用 YOLO26 的 shortcut=True
#   2) 检测头由 Detect 换成 v26Detect（end2end + reg_max=1）
# 这样「YOLO11 vs YOLO26」的横向比较只有一个变量：骨干/头的代际。
#
# 用法：
#   RGB-only:  python train_full.py --config v26-single-baseline --single-modal rgb --label-from dual
#   IR-only :  python train_full.py --config v26-single-baseline --single-modal x   --label-from ir

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # 与 dual-fusion-deform 的 RGB 支路层 0–10 逐层一致
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9  (YOLO26: shortcut=True)
  - [-1, 2, C2PSA, [1024]]            # 10

head:
  # 与 YOLO11 单模态基线的层 11–23 逐层一致（仅头类型换代）
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16  P3/8-small
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 6], 1, Concat, [1]]                    # 18  骨干 P4（层 6）
  - [-1, 2, C3k2, [512, False]]                  # 19  P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21  骨干 P5（层 10）
  - [-1, 2, C3k2, [1024, True]]                  # 22  P5/32-large
  - [[16, 19, 22], 1, v26Detect, [nc]]           # 23  单检测头（三尺度，端到端）
