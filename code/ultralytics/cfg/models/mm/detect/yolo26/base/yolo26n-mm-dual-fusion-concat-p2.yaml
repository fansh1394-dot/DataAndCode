# Ultralytics YOLO26MM Dual-Head + Fusion (NAIVE CONCAT + P2 HEAD) Configuration
#
# 实验目的
# --------
# 与 yolo26n-mm-dual-fusion-concat.yaml（M0 基线）的**唯一差异**：
#   四条分支（rgb / ir / fuse / fuse_ir）的检测头输入由 P3-P5 扩展为 P2-P5。
#
# 为什么要四条分支都加 P2
# ------------------------
# DualHeadFusionDetectV26.__init__ 强制校验各分支 nl 一致：
#   if len(set(nls.values())) != 1: raise ValueError(...)
# 只给 fuse 分支加 P2 会直接构建失败，因此 rgb / ir / fuse 三条 neck 都要
# 新增 P2 输出路径，fuse_ir 复用 fuse 的 P2 特征。
#
# 设计要点
# --------
# - P2 通道取 128（不取 256）：P2 在 640 输入下是 160×160，通道过大会导致
#   显存与算力暴涨，batch 32 下极易 OOM，反而破坏与基线的可比性。
# - RGB/IR 的 P2 由各自的 P3 上采样后与 backbone P2 拼接：
#     RGB: L27(256,stride8) ↑2x + backbone L2(64,stride4)  -> 320 -> C3k2 128
#     IR : L42(256,stride8) ↑2x + backbone L13(64,stride4) -> 320 -> C3k2 128
# - fuse P2 由两路 P2 拼接后 1x1 压回 128：
#     L61 concat(L36,L51)=256 -> L62 Conv1x1 128 -> L63 C3k2 128
#
# 判定
# ----
# 基线三种子 μ=0.7551，σ=0.0094，2σ=0.0188
#   新组 > 0.7739  -> 小目标是真瓶颈，P2 有效（可写进第 5 章为改进点）
#   新组 < 0.7363  -> P2 显著有害，进一步强化「瓶颈不在检测尺度」的结论
#   区间内         -> 无显著差异，同样支持「架构侧边际收益趋零」
#
# 层号对照（相对原 concat 版本的位移）
# -------------------------------------
#   原 34-45 (IR neck)      -> 新 37-48   (+3，因 RGB P2 插入 3 层)
#   原 46-54 (fusion neck)  -> 新 52-60   (+6)
#   原 55-59 (heads)        -> 新 64-68   (+9)
#   内部绝对引用 36 -> 39（IR neck 的 C3k2，位于 IR P4 融合处）

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ---------------- RGB 支路 (0-10) ----------------
  - [-1, 1, Conv, [64, 3, 2], 'RGB']             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2  (64ch @ P2)
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 9
  - [-1, 2, C2PSA, [1024]]                       # 10

  # ---------------- IR 支路 (11-21) ----------------
  - [-1, 1, Conv, [64, 3, 2], 'X']               # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 13 (64ch @ P2)
  - [-1, 1, Conv, [256, 3, 2]]                   # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 15
  - [-1, 1, Conv, [512, 3, 2]]                   # 16-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 17
  - [-1, 1, Conv, [1024, 3, 2]]                  # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 19
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 20
  - [-1, 2, C2PSA, [1024]]                       # 21

head:
  # ---------------- RGB neck (22-36) ----------------
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 22
  - [[-1, 6], 1, Concat, [1]]                    # 23
  - [-1, 2, C3k2, [512, False]]                  # 24
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 25
  - [[-1, 4], 1, Concat, [1]]                    # 26
  - [-1, 2, C3k2, [256, False]]                  # 27 (RGB P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 28
  - [[-1, 24], 1, Concat, [1]]                   # 29
  - [-1, 2, C3k2, [512, False]]                  # 30 (RGB P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 31
  - [[-1, 10], 1, Concat, [1]]                   # 32
  - [-1, 2, C3k2, [1024, True]]                  # 33 (RGB P5)

  # ---- RGB P2 分支（新增）：P3 上采样 + backbone P2(64) -> 320 -> 128 ----
  - [27, 1, nn.Upsample, [None, 2, "nearest"]]   # 34
  - [[-1, 2], 1, Concat, [1]]                    # 35 (320ch @ stride4)
  - [-1, 2, C3k2, [128, False]]                  # 36 (RGB P2)

  # ---------------- IR neck (37-51) ----------------
  - [21, 1, nn.Upsample, [None, 2, "nearest"]]   # 37
  - [[-1, 17], 1, Concat, [1]]                   # 38
  - [-1, 2, C3k2, [512, False]]                  # 39
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 40
  - [[-1, 15], 1, Concat, [1]]                   # 41
  - [-1, 2, C3k2, [256, False]]                  # 42 (IR P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 43
  - [[-1, 39], 1, Concat, [1]]                   # 44
  - [-1, 2, C3k2, [512, False]]                  # 45 (IR P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 46
  - [[-1, 21], 1, Concat, [1]]                   # 47
  - [-1, 2, C3k2, [1024, True]]                  # 48 (IR P5)

  # ---- IR P2 分支（新增）----
  - [42, 1, nn.Upsample, [None, 2, "nearest"]]   # 49
  - [[-1, 13], 1, Concat, [1]]                   # 50 (320ch @ stride4)
  - [-1, 2, C3k2, [128, False]]                  # 51 (IR P2)

  # ---------------- 融合 neck (52-63)：Concat + 1x1 压回原通道 ----------------
  # P3: 27(RGB 256) + 42(IR 256) -> 512 -> 256
  - [[27, 42], 1, Concat, [1]]                   # 52
  - [-1, 1, Conv, [256, 1, 1]]                   # 53
  - [-1, 2, C3k2, [256, False]]                  # 54 fuse P3
  # P4: 30(512) + 45(512) -> 1024 -> 512
  - [[30, 45], 1, Concat, [1]]                   # 55
  - [-1, 1, Conv, [512, 1, 1]]                   # 56
  - [-1, 2, C3k2, [512, False]]                  # 57 fuse P4
  # P5: 33(1024) + 48(1024) -> 2048 -> 1024
  - [[33, 48], 1, Concat, [1]]                   # 58
  - [-1, 1, Conv, [1024, 1, 1]]                  # 59
  - [-1, 2, C3k2, [1024, True]]                  # 60 fuse P5
  # P2: 36(RGB 128) + 51(IR 128) -> 256 -> 128
  - [[36, 51], 1, Concat, [1]]                   # 61
  - [-1, 1, Conv, [128, 1, 1]]                   # 62
  - [-1, 2, C3k2, [128, False]]                  # 63 fuse P2

  # ---------------- 四个 v26Detect 头（P2-P5）+ 聚合层 ----------------
  - [[36, 27, 30, 33], 1, v26Detect, [nc]]       # 64 rgb 头
  - [[51, 42, 45, 48], 1, v26Detect, [nc]]       # 65 ir  头
  - [[63, 54, 57, 60], 1, v26Detect, [nc]]       # 66 fuse 头
  - [[63, 54, 57, 60], 1, v26Detect, [nc]]       # 67 fuse_ir 头
  - [[64, 65, 66, 67], 1, DualHeadFusionDetectV26, []]   # 68 聚合层
