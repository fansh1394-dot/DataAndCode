# Ultralytics YOLO26MM Dual-Head + Fusion (NAIVE CONCAT) Configuration
# M0：朴素拼接融合对照 —— 与 yolo26n-mm-dual-fusion-deform.yaml（M3）严格对齐
#
# 与 M3 的唯一差异：三个融合节点由 DeformableCrossModalFusion 换成
#   Concat + 1x1 Conv（压回原通道），其余骨干/neck/检测头/聚合层完全一致。
#
# 为什么加 1x1 Conv：
#   直接 Concat 会使下游 C3k2 输入通道翻倍（256->512），参数量与算力随之改变，
#   对比就不再是「只换融合算子」。1x1 Conv 把通道压回原值，使 M0 与 M3 的
#   参数量级、neck 宽度、检测头完全一致。
#
# 用途：作为「融合方法层」的基线（L2）。有了它才能回答：
#   - 可变形交叉注意力相对朴素拼接的净增益是多少（这是现有方法的贡献）
#   - 后续改进相对 M3 的增量是多少（这才是本文的贡献）
#
# 检测头分配（与 M3 一致）：
#   L52 rgb 头 / L53 ir 头 / L54 fuse 头 / L55 fuse_ir 头 / L56 聚合层
#   （三节点+1x1 后层号整体后移 3，见下）

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ---------------- RGB 支路 (0-10) ----------------
  - [-1, 1, Conv, [64, 3, 2], 'RGB']             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 9
  - [-1, 2, C2PSA, [1024]]                       # 10

  # ---------------- IR 支路 (11-21) ----------------
  - [-1, 1, Conv, [64, 3, 2], 'X']               # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 13
  - [-1, 1, Conv, [256, 3, 2]]                   # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 15
  - [-1, 1, Conv, [512, 3, 2]]                   # 16-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 17
  - [-1, 1, Conv, [1024, 3, 2]]                  # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 19
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 20
  - [-1, 2, C2PSA, [1024]]                       # 21

head:
  # ---------------- RGB neck (22-33) ----------------
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 22
  - [[-1, 6], 1, Concat, [1]]                    # 23
  - [-1, 2, C3k2, [512, False]]                  # 24
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 25
  - [[-1, 4], 1, Concat, [1]]                    # 26
  - [-1, 2, C3k2, [256, False]]                  # 27 (RGB P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 28
  - [[-1, 24], 1, Concat, [1]]                   # 29
  - [-1, 2, C3k2, [512, False]]                  # 30 (RGB P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 31
  - [[-1, 10], 1, Concat, [1]]                   # 32
  - [-1, 2, C3k2, [1024, True]]                  # 33 (RGB P5)

  # ---------------- IR neck (34-45) ----------------
  - [21, 1, nn.Upsample, [None, 2, "nearest"]]   # 34
  - [[-1, 17], 1, Concat, [1]]                   # 35
  - [-1, 2, C3k2, [512, False]]                  # 36
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 37
  - [[-1, 15], 1, Concat, [1]]                   # 38
  - [-1, 2, C3k2, [256, False]]                  # 39 (IR P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 40
  - [[-1, 36], 1, Concat, [1]]                   # 41
  - [-1, 2, C3k2, [512, False]]                  # 42 (IR P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 43
  - [[-1, 21], 1, Concat, [1]]                   # 44
  - [-1, 2, C3k2, [1024, True]]                  # 45 (IR P5)

  # ---------------- 融合 neck (46-54)：错位感知门控拼接 + 1x1 压回原通道 ----------------
# G1：三个融合节点用 MisalignGatedConcat 替换 Concat，对 IR 半边乘逐样本 alpha in [0.2, 1]。
#     通道布局与总通道数不变（仍为两路之和），故 neck 其余部分与 M0 完全一致。
  # P3：27(RGB 256) + 39(IR 256) -> Concat 512 -> 1x1 Conv 256
  - [[27, 39], 1, MisalignGatedConcat, [0.2]]                   # 46 (512ch)
  - [-1, 1, Conv, [256, 1, 1]]                   # 47 (压回 256)
  - [-1, 2, C3k2, [256, False]]                  # 48 fuse P3
  # P4：30 + 42 -> 1024 -> 512
  - [[30, 42], 1, MisalignGatedConcat, [0.2]]                   # 49
  - [-1, 1, Conv, [512, 1, 1]]                   # 50
  - [-1, 2, C3k2, [512, False]]                  # 51 fuse P4
  # P5：33 + 45 -> 2048 -> 1024
  - [[33, 45], 1, MisalignGatedConcat, [0.2]]                   # 52
  - [-1, 1, Conv, [1024, 1, 1]]                  # 53
  - [-1, 2, C3k2, [1024, True]]                  # 54 fuse P5

  # ---------------- 四个 v26Detect 头 + 聚合层 ----------------
  - [[27, 30, 33], 1, v26Detect, [nc]]           # 55 rgb 头
  - [[39, 42, 45], 1, v26Detect, [nc]]           # 56 ir  头
  - [[48, 51, 54], 1, v26Detect, [nc]]           # 57 fuse 头
  - [[48, 51, 54], 1, v26Detect, [nc]]           # 58 fuse_ir 头
  - [[55, 56, 57, 58], 1, DualHeadFusionDetectV26, []]   # 59 聚合层
