# Gated reliability-aware non-aligned dual-head fusion (改动 A: 显式门控).
# 与 yolo11n-mm-dual-fusion-reliable.yaml 的唯一架构差异：三个融合节点由
# ReliabilityAwareFusion（凸组合 w0*rgb+w1*ir, w0+w1=1）换成 GatedReliabilityFusion
# （残差 fused = base + g*(ir - rgb), g=sigmoid(...)），以打破凸组合上限、允许融合
# 在 IR 提供互补信息时真正超过单模态。其余骨干/neck/四个检测头与 reliable 版完全一致，
# 保证只改「融合算子」一个变量，可与 N0 / S4 / S5 直接对照。
#
# GatedReliabilityFusion 参数：[ouc, max_offset, base, gate]
#   base: 'rgb'（A1，默认）| 'mean'（A2）
#   gate: 'channel'（默认）| 'pixel'

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [21, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 36], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  # 三个融合节点：唯一的架构改动（相对 reliable 版仅为融合算子替换）
  - [[27, 39], 1, GatedReliabilityFusion, [256, 0.08]]
  - [-1, 2, C3k2, [256, False]]
  - [[30, 42], 1, GatedReliabilityFusion, [512, 0.08]]
  - [-1, 2, C3k2, [512, False]]
  - [[33, 45], 1, GatedReliabilityFusion, [1024, 0.08]]
  - [-1, 2, C3k2, [1024, True]]
  - [[27, 30, 33], 1, Detect, [nc]]
  - [[39, 42, 45], 1, Detect, [nc]]
  - [[47, 49, 51], 1, Detect, [nc]]
  - [[47, 49, 51], 1, Detect, [nc]]
  - [[52, 53, 54, 55], 1, DualHeadFusionDetect, []]
