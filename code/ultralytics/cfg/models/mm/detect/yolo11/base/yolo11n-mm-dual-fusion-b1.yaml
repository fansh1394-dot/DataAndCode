# Ultralytics YOLO11 🚀 MultiModal Dual-Head + Fusion Branch (B1: Dual-Coordinate Supervision)
# =============================================================================
# B1 变体：在 yolo11n-mm-dual-fusion.yaml 基础上，为「融合分支」增设第二个
# 检测头 fuse_ir，用 IR 坐标系标签（labels_ir/）监督同一组融合特征。
#
# 为什么需要它（问题来源）
# -----------------------
# 原 dual-fusion 架构下对困难子集（仅 IR 可见的 509 帧）的实测三项诊断：
#   1. 融合颈激活幅值：L46 RGB 52.5% / L50 RGB 44.4%（IR 反而更高）→ 未偏废 IR
#   2. 融合颈卷积权重切分：P4 49.9:50.1、P5 50.1:49.9            → 权重均衡
#   3. 行为测试：把融合颈的 RGB 半边置零 → fuse 头 mAP50 由 0.04486 直接归零
# 结论：融合头并未「通过颈部通道加权偏废 IR」，而是把 IR 当作 RGB 坐标系下的
# 辅助/对齐线索使用，自身从未被要求「在 IR 坐标系下独立成立」。一旦 RGB 锚点
# 消失，均衡权重的 IR 输入没有立足点，输出即崩溃。
#
# 根因：原配置中 fuse 头 ← batch["bboxes"]（RGB 坐标系）。融合特征缺少一个
# 「以 IR 坐标系为参照」的监督信号。
#
# 本架构的改动（相对原 dual-fusion，只加不改）
# --------------------------------------------
#   fuse    头 ← batch["bboxes"]      + batch["cls"]       （RGB 坐标系，原样保留）
#   fuse_ir 头 ← batch["bboxes_ir"]   + batch["cls_ir"]    （IR 坐标系，B1 新增）
# 两个头共享同一组融合 neck 特征（47/49/51），不共享检测头参数。它们构成对融合
# 特征的双坐标系约束：融合特征必须同时能解码出 RGB 系与 IR 系两组框。
#
# 与 IR 头的区别：IR 头吃的是 IR neck 特征（39/42/45），只监督 IR 支路本身；
# fuse_ir 头吃的是融合 neck 特征（47/49/51），监督的是「融合结果是否在 IR 坐标系
# 下也成立」，这是 IR 头无法替代的。
#
# 兼容性与开关
# ------------
#   原 yolo11n-mm-dual-fusion.yaml 保持不变（A0-2 等历史实验可复现）。
#   本文件采用 4 输入聚合层；DualHeadFusionDetect 同时支持 3 输入（旧）与 4 输入
#   （新），3 输入路径行为逐位不变。
#   hyp 侧对应开关：mm_dual_w_fuse_ir（默认 1.0，仅在挂载 fuse_ir 头时生效）。
# =============================================================================

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ============ RGB 路径 (层 0-10) ============
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 RGB路径结束

  # ============ IR 路径 (层 11-21) ============
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2 IR路径起始（from=-1 由路由重定向到 IR 输入）
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 IR路径结束

head:
  # ============ RGB neck 与检测分支 (层 22-33) ============
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 22 从 RGB backbone P5 上采样
  - [[-1, 6], 1, Concat, [1]]                    # 23 cat RGB backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 24
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 25
  - [[-1, 4], 1, Concat, [1]]                    # 26 cat RGB backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 27 (RGB P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]                   # 28
  - [[-1, 24], 1, Concat, [1]]                   # 29 cat RGB head P4
  - [-1, 2, C3k2, [512, False]]                  # 30 (RGB P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]                   # 31
  - [[-1, 10], 1, Concat, [1]]                   # 32 cat RGB backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 33 (RGB P5/32-large)

  # ============ IR neck 与检测分支 (层 34-45) ============
  - [21, 1, nn.Upsample, [None, 2, "nearest"]]   # 34 从 IR backbone P5 上采样
  - [[-1, 17], 1, Concat, [1]]                   # 35 cat IR backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 36
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 37
  - [[-1, 15], 1, Concat, [1]]                   # 38 cat IR backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 39 (IR P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]                   # 40
  - [[-1, 36], 1, Concat, [1]]                   # 41 cat IR head P4
  - [-1, 2, C3k2, [512, False]]                  # 42 (IR P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]                   # 43
  - [[-1, 21], 1, Concat, [1]]                   # 44 cat IR backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 45 (IR P5/32-large)

  # ============ 融合 neck (层 46-51) ============
  # 逐尺度拼接两模态 neck 特征，作为「融合分支」的输入
  - [[27, 39], 1, Concat, [1]]                   # 46 融合 P3 (RGB P3 + IR P3)
  - [-1, 2, C3k2, [256, False]]                  # 47 融合 P3 特征处理 (P3/8-small)
  - [[30, 42], 1, Concat, [1]]                   # 48 融合 P4 (RGB P4 + IR P4)
  - [-1, 2, C3k2, [512, False]]                  # 49 融合 P4 特征处理 (P4/16-medium)
  - [[33, 45], 1, Concat, [1]]                   # 50 融合 P5 (RGB P5 + IR P5)
  - [-1, 2, C3k2, [1024, True]]                  # 51 融合 P5 特征处理 (P5/32-large)

  # ============ 四个独立检测头 ============
  # 每个 head 各自接收本分支的 P3/P4/P5，互不共享参数
  - [[27, 30, 33], 1, Detect, [nc]]              # 52 RGB     头 Detect(RGB  P3, P4, P5) ← RGB 标签
  - [[39, 42, 45], 1, Detect, [nc]]              # 53 IR      头 Detect(IR   P3, P4, P5) ← IR  标签
  - [[47, 49, 51], 1, Detect, [nc]]              # 54 Fuse    头 Detect(Fuse P3, P4, P5) ← RGB 标签
  - [[47, 49, 51], 1, Detect, [nc]]              # 55 Fuse-IR 头 Detect(Fuse P3, P4, P5) ← IR  标签（B1 新增）

  # 聚合层：把四路输出打包成 {"rgb": ..., "ir": ..., "fuse": ..., "fuse_ir": ...}
  - [[52, 53, 54, 55], 1, DualHeadFusionDetect, []]  # 56 聚合头（模型最后一层）

# =============================================================================
# 与 yolo11n-mm-dual-fusion.yaml 的差异（仅两行）
# -----------------------------------------------------------------------------
#   + 第 55 层  Fuse-IR 头：复用融合特征 47/49/51，← IR 坐标系标签
#   ~ 第 56 层  聚合层输入由 [52,53,54] 扩为 [52,53,54,55]
#   其余层号、通道、连接完全一致；三个原分支的监督关系未做任何改动。
#
# 预期收益：
#   1. 融合特征被要求「在两个坐标系下都能解码出正确框」，无法再退化为
#      「RGB 坐标系下的辅助线索」；
#   2. 困难场景（仅 IR 可见）下，IR 系监督为融合头提供不依赖 RGB 锚点的梯度，
#      预期 A 组 fuse mAP50 由 0.0011 显著抬升；
#   3. 可作为消融项：与 fuse 头单坐标系监督直接对照，量化"双坐标系监督"的增益。
#
# 已知风险：
#   - loss_items 由 9 项（3 分支 × 3）扩为 12 项（4 分支 × 3），任何按固定长度
#     展开 val loss 列名 / 解析 results.csv 的下游代码必须同步；
#   - 4 输入聚合层改变了模块数，历史 best.pt 权重无法直接 load（本变体需从头训）。
# =============================================================================
